; Refresh button
[RefreshUsageBtnBg]
Meter=Shape
Shape=Rectangle 220,([MeasureUsageY]+4),44,22,6,6 | Fill Color #BgProject# | StrokeWidth 1 | Stroke Color #BorderColor#
MouseOverAction=[!SetOption RefreshUsageBtnBg Shape "Rectangle 220,([MeasureUsageY]+4),44,22,6,6 | Fill Color #BgProjectHover# | StrokeWidth 1 | Stroke Color #CyanAccent#"][!UpdateMeter RefreshUsageBtnBg][!Redraw]
MouseLeaveAction=[!SetOption RefreshUsageBtnBg Shape "Rectangle 220,([MeasureUsageY]+4),44,22,6,6 | Fill Color #BgProject# | StrokeWidth 1 | Stroke Color #BorderColor#"][!UpdateMeter RefreshUsageBtnBg][!Redraw]
LeftMouseUpAction=[!CommandMeasure MeasureUsageFetch "Run"][!CommandMeasure MeasureUsageScript "UpdateUsage()"]
ToolTipText=Refresh usage data
DynamicVariables=1

[RefreshUsageBtn]
Meter=String
FontFace=#FontFace#
FontSize=8
FontWeight=600
FontColor=#CyanAccent#
AntiAlias=1
X=242
Y=([MeasureUsageY]+7)
StringAlign=Center
Text=Sync
LeftMouseUpAction=[!CommandMeasure MeasureUsageFetch "Run"][!CommandMeasure MeasureUsageScript "UpdateUsage()"]
DynamicVariables=1

