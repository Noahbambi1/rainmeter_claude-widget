NeonBgProjectHover=55,35,85
NeonBorderColor=80,50,120
NeonGreenAccent=0,255,180
NeonBlueAccent=100,180,255
NeonPurpleAccent=180,100,255
NeonPinkAccent=255,80,180
NeonCyanAccent=0,220,255
; Active colors (will be set based on CurrentTheme)
AccentOrange=217,119,87
TextBright=255,255,255
TextColor=230,230,235
TextMuted=160,160,170
TextDim=100,100,115
BgDeep=15,15,25
BgCard=32,32,48
BgProject=40,40,58
BgProjectHover=55,55,75
GreenAccent=52,211,153
BlueAccent=96,165,250
PurpleAccent=167,139,250
PinkAccent=244,114,182
CyanAccent=34,211,238
BorderColor=80,80,100
Width=340
; Section states (0=expanded, 1=collapsed)
CmdCollapsed=0
CapCollapsed=1
LaunchCollapsed=0
UsageCollapsed=0
; Model selection (0=default, 1=opus, 2=sonnet, 3=haiku)
SelectedModel=0
; Heights
HeaderHeight=70
CmdExpHeight=145
CmdColHeight=32
CapExpHeight=165
CapColHeight=32
LaunchExpHeight=175
LaunchColHeight=32
UsageExpHeight=160
UsageColHeight=32
SubscriptionBadge=Max
Gap=12
; Usage data (updated live from API)
SessionPercent=0
SessionReset=Loading...
WeeklyPercent=0
WeeklyReset=Loading...
SonnetPercent=0
SonnetReset=Loading...

; ============== TOGGLE MEASURES ==============
[MeasureThemeScript]
Measure=Script
ScriptFile=ThemeManager.lua
UpdateDivider=-1

[MeasureUsageScript]
Measure=Script
ScriptFile=UsageManager.lua
UpdateDivider=-1

; Fetch usage data every 60 seconds
[MeasureUsageFetch]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-ExecutionPolicy Bypass -WindowStyle Hidden -File "#CURRENTPATH#FetchUsage.ps1"
State=Hide
OutputType=ANSI
UpdateDivider=-1
FinishAction=[!CommandMeasure MeasureUsageScript "UpdateUsage()"]

; Auto-refresh timer - triggers every 60 seconds
[MeasureAutoRefresh]
Measure=Calc
Formula=1
UpdateDivider=60
OnUpdateAction=[!CommandMeasure MeasureUsageFetch "Run"]

; Desktop icons toggle (runs hidden)
[MeasureDesktopIconsToggle]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-ExecutionPolicy Bypass -WindowStyle Hidden -File "#CURRENTPATH#ToggleDesktopIcons.ps1"
State=Hide
UpdateDivider=-1

[MeasureTheme]
Measure=Calc
Formula=#CurrentTheme#
Substitute="0":"Dark","1":"Light","2":"Neon"
DynamicVariables=1

[MeasureCmdToggle]
Measure=Calc
Formula=#CmdCollapsed#
Substitute="0":"-","1":"+"
DynamicVariables=1

[MeasureCapToggle]
Measure=Calc
Formula=#CapCollapsed#
Substitute="0":"-","1":"+"
DynamicVariables=1

[MeasureLaunchToggle]
Measure=Calc
Formula=#LaunchCollapsed#
Substitute="0":"-","1":"+"
DynamicVariables=1

[MeasureUsageToggle]
Measure=Calc
Formula=#UsageCollapsed#
Substitute="0":"-","1":"+"
DynamicVariables=1

[MeasureModelName]
Measure=Calc
Formula=#SelectedModel#
Substitute="0":"Default","1":"Opus","2":"Sonnet","3":"Haiku"
DynamicVariables=1

[MeasureModelFlag]
Measure=Calc
Formula=#SelectedModel#
Substitute="0":"","1":" --model claude-opus-4-5-20251101","2":" --model claude-sonnet-4-20250514","3":" --model claude-haiku-4-5-20250514"
DynamicVariables=1

; ============== POSITION CALCULATIONS ==============
[MeasureCmdHeight]
Measure=Calc
Formula=(#CmdCollapsed# = 1 ? #CmdColHeight# : #CmdExpHeight#)
DynamicVariables=1

[MeasureCmdY]
Measure=Calc
Formula=(#HeaderHeight# + 6)

[MeasureCapY]
Measure=Calc
Formula=[MeasureCmdY] + [MeasureCmdHeight] + #Gap#
DynamicVariables=1

[MeasureCapHeight]
Measure=Calc
Formula=(#CapCollapsed# = 1 ? #CapColHeight# : #CapExpHeight#)
DynamicVariables=1

[MeasureLaunchY]
Measure=Calc
Formula=[MeasureCapY] + [MeasureCapHeight] + #Gap#
DynamicVariables=1

[MeasureLaunchHeight]
Measure=Calc
Formula=(#LaunchCollapsed# = 1 ? #LaunchColHeight# : #LaunchExpHeight#)
DynamicVariables=1

[MeasureUsageY]
Measure=Calc
Formula=[MeasureLaunchY] + [MeasureLaunchHeight] + #Gap#
DynamicVariables=1

[MeasureUsageHeight]
Measure=Calc
Formula=(#UsageCollapsed# = 1 ? #UsageColHeight# : #UsageExpHeight#)
DynamicVariables=1

[MeasureTotalHeight]
Measure=Calc
Formula=[MeasureUsageY] + [MeasureUsageHeight] + 40
DynamicVariables=1

