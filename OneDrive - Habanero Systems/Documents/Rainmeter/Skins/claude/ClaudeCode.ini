; ClaudeCode.ini
; Claude Code Dashboard - Rainmeter skin configuration

[Rainmeter]
Update=1000
BackgroundMode=2
SolidColor=0,0,0,1
DynamicWindowSize=1
AccurateText=1
OnRefreshAction=[!CommandMeasure MeasureThemeScript "ApplyTheme()"][!CommandMeasure MeasureUsageScript "UpdateUsage()"]

[Metadata]
Name=Claude Code Dashboard
Author=Claude
Version=2.2
Description=Modern Claude Code dashboard with collapsible sections

; ============== VARIABLES ==============
