# commit-msg hook configuration
# Toggle individual normalization rules on or off.
# Values: true | false

# Capitalize the first letter of the subject line (after optional number prefix)
capitalize=true

# Remove trailing period(s) from the subject line
strip-period=true

# Warn if the subject line exceeds 72 characters (does not block the commit)
max-length=true

# Strip trailing whitespace from every line
strip-whitespace=true
